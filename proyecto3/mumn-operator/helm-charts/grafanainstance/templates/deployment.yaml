apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grafanainstance.fullname" . }}
  labels:
    {{- include "grafanainstance.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "grafanainstance.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "grafanainstance.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: GF_INSTALL_PLUGINS
              value: "redis-datasource"
          volumeMounts:
            - name: grafana-datasource
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: grafana-datasource
          configMap:
            name: {{ include "grafanainstance.fullname" . }}-datasource