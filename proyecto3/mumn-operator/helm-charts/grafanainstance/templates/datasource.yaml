apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafanainstance.fullname" . }}-datasource
  labels:
    {{- include "grafanainstance.labels" . | nindent 4 }}
data:
  datasource.yaml: |-
    apiVersion: 1
    datasources:
      - name: Valkey
        type: redis-datasource
        url: redis://valkey-server-valkeyinstance:6379
        access: proxy
        isDefault: true