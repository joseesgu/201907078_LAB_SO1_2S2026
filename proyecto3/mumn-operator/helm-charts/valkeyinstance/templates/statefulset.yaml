apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "valkeyinstance.fullname" . }}
  labels:
    {{- include "valkeyinstance.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "valkeyinstance.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "valkeyinstance.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "valkeyinstance.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          volumeMounts:
            - name: valkey-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: valkey-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.persistence.size }}