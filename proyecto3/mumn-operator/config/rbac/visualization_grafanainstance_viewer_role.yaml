# permissions for end users to view grafanainstances.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: grafanainstance-viewer-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: mumn-operator
    app.kubernetes.io/part-of: mumn-operator
    app.kubernetes.io/managed-by: kustomize
  name: grafanainstance-viewer-role
rules:
- apiGroups:
  - visualization.usac.edu.gt
  resources:
  - grafanainstances
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - visualization.usac.edu.gt
  resources:
  - grafanainstances/status
  verbs:
  - get
