---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - configmaps
  - secrets
  - events
  - services
  - persistentvolumeclaims
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - daemonsets
  - replicasets
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - db.usac.edu.gt
  resources:
  - valkeyinstances
  - valkeyinstances/status
  - valkeyinstances/finalizers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - visualization.usac.edu.gt
  resources:
  - grafanainstances
  - grafanainstances/status
  - grafanainstances/finalizers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
