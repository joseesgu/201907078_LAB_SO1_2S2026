apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-consumer
  labels:
    app: go-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-consumer
  template:
    metadata:
      labels:
        app: go-consumer
    spec:
      containers:
      - name: go-consumer
        image: localhost:8443/go-consumer:latest
        imagePullPolicy: IfNotPresent