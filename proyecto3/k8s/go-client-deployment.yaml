apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-client
  labels:
    app: go-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-client
  template:
    metadata:
      labels:
        app: go-client
    spec:
      containers:
      - name: go-client
        image: localhost:8443/go-client:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: go-client-svc
spec:
  selector:
    app: go-client
  ports:
  - port: 8081
    targetPort: 8081